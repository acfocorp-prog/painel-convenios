# Busca automática de avisos oficiais em fontes públicas (Querido Diário,
# FNDE, MEC) e grava em `public.official_deadlines` via Supabase REST.
#
# Fontes e como adicionar uma nova: ver `scripts/fetch-official-deadlines.mjs`.
#
# IMPORTANTE: este arquivo vive em `scripts/`. Para ser executado pelo GitHub
# Actions ele precisa estar em `.github/workflows/fetch-official-deadlines.yml`.
# A operação de mover é uma operação de 1 commit (renomear arquivo) e exige
# que o PAT do remote tenha scope `workflow`. Quando mover, lembre de:
#   1. Criar/renomear este arquivo em `.github/workflows/`
#   2. Apagar este aqui (scripts/fetch-official-deadlines.yml)
#   3. Configurar os secrets no repositório:
#      - VITE_SUPABASE_URL          (já em uso pelo deploy)
#      - SUPABASE_SERVICE_ROLE_KEY  (Supabase → Settings → API; NÃO é a anon key)

name: Fetch official deadlines

on:
  schedule:
    # 0 11 UTC = 8h BRT (BRT é UTC-3, sem horário de verão)
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: official-deadlines-fetch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Buscar avisos (Querido Diário + FNDE + MEC)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Customize para o seu município: CSV de códigos IBGE.
          # Default = principais capitais brasileiras.
          QD_TERRITORY_IDS: ${{ secrets.QD_TERRITORY_IDS }}
          LOOKBACK_DAYS: '14'
        run: node scripts/fetch-official-deadlines.mjs
